<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPhone Tilt Test</title>
</head>

<body>
    <h1>📱 iPhone 傾きテスト</h1>

    <button id="start">センサーを開始</button>

    <h2>接続状態</h2>
    <p id="connection">未接続</p>

    <h2>傾き</h2>

    <p>前後（Beta）: <span id="beta">---</span></p>
    <p>左右（Gamma）: <span id="gamma">---</span></p>
    <p>回転（Alpha）: <span id="alpha">---</span></p>

    <script>
        const serverUrl =
            "wss://candles-arguments-micro-pts.trycloudflare.com";

        let socket;

        document.getElementById("start").addEventListener("click", async () => {

            // WebSocket接続
            socket = new WebSocket(serverUrl);

            socket.addEventListener("open", () => {
                document.getElementById("connection").textContent =
                    "Macに接続しました！";
            });

            socket.addEventListener("close", () => {
                document.getElementById("connection").textContent =
                    "Macとの接続が切れました";
            });

            socket.addEventListener("error", () => {
                document.getElementById("connection").textContent =
                    "接続エラー";
            });

            // iPhoneのセンサー許可
            if (typeof DeviceOrientationEvent.requestPermission === "function") {

                const permission =
                    await DeviceOrientationEvent.requestPermission();

                if (permission !== "granted") {
                    alert("センサーの許可が必要です");
                    return;
                }
            }

            window.addEventListener("deviceorientation", (event) => {

                const beta = event.beta ?? 0;
                const gamma = event.gamma ?? 0;
                const alpha = event.alpha ?? 0;

                // 画面に表示
                document.getElementById("beta").textContent =
                    beta.toFixed(1);

                document.getElementById("gamma").textContent =
                    gamma.toFixed(1);

                document.getElementById("alpha").textContent =
                    alpha.toFixed(1);

                // Macへ送信
                if (socket && socket.readyState === WebSocket.OPEN) {

                    const data = {
                        beta: beta,
                        gamma: gamma,
                        alpha: alpha
                    };

                    socket.send(JSON.stringify(data));
                }
            });
        });
    </script>
</body>
</html>

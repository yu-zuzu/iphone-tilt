<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>iPhone Tilt Test</title>
</head>

<body>
    <h1>📱 iPhone 傾きテスト</h1>

    <button id="start">センサーを開始</button>

    <h2>傾き</h2>

    <p>前後（Beta）: <span id="beta">---</span></p>
    <p>左右（Gamma）: <span id="gamma">---</span></p>
    <p>回転（Alpha）: <span id="alpha">---</span></p>

    <script>
        document.getElementById("start").addEventListener("click", async () => {

            if (typeof DeviceOrientationEvent.requestPermission === "function") {
                const permission =
                    await DeviceOrientationEvent.requestPermission();

                if (permission !== "granted") {
                    alert("センサーの許可が必要です");
                    return;
                }
            }

            window.addEventListener("deviceorientation", (event) => {

                document.getElementById("alpha").textContent =
                    event.alpha?.toFixed(1);

                document.getElementById("beta").textContent =
                    event.beta?.toFixed(1);

                document.getElementById("gamma").textContent =
                    event.gamma?.toFixed(1);
            });
        });
    </script>
</body>
</html>
